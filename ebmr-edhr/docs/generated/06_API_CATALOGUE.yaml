      method: POST
      path: '/reconciliation/v1/material/evaluate'
      owner_module: SPEC-EBMR-008
      owner_path: services/gxp-api/src/modules/ebmr
      work_package: WP-03
      source_document: Document 17
      source_section: '6. APIs'
      authentication: platform IdP session or service identity (Doc 62)
      authorization: policy decision required before execution (Doc 07)
      signature_required: policy_lookup
      idempotency: required (Idempotency-Key)
      expected_version: required
      transaction_effect: single authoritative PostgreSQL transaction
      error_codes: []
      requirements: [YLD-FR-001, YLD-FR-002, YLD-FR-003, YLD-FR-004, YLD-FR-005, YLD-FR-006, YLD-FR-007, YLD-FR-008, YLD-FR-009, YLD-FR-010, YLD-FR-011, YLD-FR-012]
      request_schema: contracts/openapi/spec-ebmr-008.yaml#/components/schemas
      request_shape_change_2026_08_27_b: >
        ADDITIVE, all four reconciliation evaluate operations. `loss_reasons` (YLD-FR-021): list of
        {category, description, quantity?} -- REQUIRED whenever quantities.approved_loss > 0, and where
        every entry carries a quantity they must sum to approved_loss; the command is rejected
        VALIDATION_FAILED otherwise. The category vocabulary is intentionally unconstrained (SG-135).
        `linked_deviation_id` (YLD-FR-021): an EXISTING QMS deviation, resolved via
        qms.service.get_deviation() and validated to the same site; populates the record's
        linked_quality_event_id from the deviation's own quality_event_id. Document 17 never creates a
        deviation (AG-05). `external_reference` (YLD-FR-027) gains a recognised shape
        {system, quantity, erp_run_id?}: after the GxP calculation the quantity is compared by exact
        Decimal equality against the computed accounted total, and a mismatch is raised in Document 53's
        ledger via erp.commands.record_reconciliation_difference (VALUE_MISMATCH, OPEN,
        requires_qa_hold=false pending SG-136) under a derived idempotency key '{key}:erp-diff' so a
        replay cannot duplicate it. The ERP value never reaches variance/state. Existing callers that
        omit all three fields are unaffected.
      response_schema: MutationReceipt | resource representation
      tests: contract + authorization + negative (Doc 102)
