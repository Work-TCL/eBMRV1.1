openapi: 3.1.0
info:
  title: SPEC-SEC-005 — Secrets Management, PKI, Cryptography & Key Lifecycle
  version: 0.1.0
  description: >
    Document 113 contract for WP-10 Document 65 (`services/gxp-api/app/modules/security/crypto*`).
    3 owned entities per the approved data-model catalogue: `secret_metadata`, `certificate_metadata`,
    `crypto_profile` — metadata only, no key material ever stored (Document 65 # 14).


    Signature: `POST /security/v1/certificates:issue`, `.../certificates/{id}/rotate` and
    `.../certificates/{id}/revoke` each require a `Released` Part 11 signature by an independent
    **QA Releaser** (Document 106 rows 137-139: "QA Approver / Batch Release", "MUST be independent of
    every production performer", Reason: yes) — resolved to the same established non-QMS role mapping as
    batch.release / edge_gateway.certificate_rotation. `POST /security/v1/secrets/{id}/rotate` has no
    Document 106 row → RBAC-gated only (Security Admin). `GET /security/v1/crypto-health` is a read-only
    self-test that returns 503 CRYPTO_HEALTH_FAILED when a critical key/certificate is missing/expired
    (KEY-FR-028, fail safe).


    The cross-cutting crypto library (`resolveSecret`, `encryptSensitiveField`,
    `decryptSensitiveField`, `hashEvidence`, trust-all guard) is `app/modules/security/crypto.py`, not
    an endpoint.
tags:
  - name: security-crypto

paths:
  /security/v1/secrets/{secret_id}/rotate:
    post:
      operationId: postRotateSecret
      tags: [security-crypto]
      summary: Rotate a managed secret's metadata/version (KEY-FR-005/006)
      x-requirement-ids: [KEY-FR-005, KEY-FR-006, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: secret_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RotateSecretCommand' } } }
      responses:
        '200': { description: Rotated., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION / SECRET_ROTATION_FAILED / IDEMPOTENCY_CONFLICT.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: VALIDATION_FAILED (missing reason)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/certificates:issue:
    post:
      operationId: postIssueServiceCertificate
      tags: [security-crypto]
      summary: Issue a service/Edge/admin certificate (KEY-FR-007/008, Document 106 row 139)
      description: Subject/SAN/profile/validity validated before issuance; requires a Released signature by an independent QA Releaser.
      x-requirement-ids: [KEY-FR-007, KEY-FR-008, MUT-FR-005, MUT-FR-010, MUT-FR-012, MUT-FR-013, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IssueServiceCertificateCommand' } } }
      responses:
        '200': { description: Issued (state ACTIVE)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '422': { description: VALIDATION_FAILED (bad subject/SAN/profile/validity)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '428': { description: MISSING_SIGNATURE., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/certificates/{certificate_id}/rotate:
    post:
      operationId: postRotateCertificate
      tags: [security-crypto]
      summary: Rotate a certificate with an overlap window (KEY-FR-009, Document 106 row 138)
      x-requirement-ids: [KEY-FR-009, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-012, MUT-FR-013, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: certificate_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RotateCertificateCommand' } } }
      responses:
        '200': { description: Rotated (new cert ACTIVE, old cert ROTATING for overlap)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION / INVALID_TRANSITION (cert not ACTIVE).", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '428': { description: MISSING_SIGNATURE., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/certificates/{certificate_id}/revoke:
    post:
      operationId: postRevokeCertificate
      tags: [security-crypto]
      summary: Revoke a certificate (KEY-FR-010, Document 106 row 137)
      x-requirement-ids: [KEY-FR-010, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-012, MUT-FR-013, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: certificate_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RevokeCertificateCommand' } } }
      responses:
        '200': { description: Revoked., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION / INVALID_TRANSITION.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: VALIDATION_FAILED (bad revocation_reason)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '428': { description: MISSING_SIGNATURE., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/crypto-health:
    get:
      operationId: getCryptoHealth
      tags: [security-crypto]
      summary: Crypto self-test / health report (KEY-FR-028)
      description: Returns 200 with the health report when healthy; 503 CRYPTO_HEALTH_FAILED when a critical key/certificate is missing, expired or inaccessible.
      x-requirement-ids: [KEY-FR-028, KEY-FR-016, KEY-FR-017]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Healthy., content: { application/json: { schema: { $ref: '#/components/schemas/CryptoHealthReport' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '503': { description: CRYPTO_HEALTH_FAILED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    RotateSecretCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, secret_id, expected_version, reason]
      x-requirement-ids: [KEY-FR-005, KEY-FR-006]
      properties:
        idempotency_key: { type: string, minLength: 1 }
        secret_id: { type: string, format: uuid }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
        overlap_minutes: { type: integer, minimum: 0, maximum: 43200, default: 60 }
        incident_ref: { type: [string, "null"], maxLength: 120 }

    IssueServiceCertificateCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, subject_sans, profile, validity_days, issuer_ref, reason]
      x-requirement-ids: [KEY-FR-007, KEY-FR-008]
      properties:
        idempotency_key: { type: string, minLength: 1 }
        subject_sans:
          type: object
          required: [subject, sans]
          properties:
            subject: { type: string, minLength: 1 }
            sans: { type: array, items: { type: string }, minItems: 1 }
        profile: { type: string, enum: [SERVICE_MTLS, EDGE_GATEWAY, ADMIN, INTEGRATION] }
        validity_days: { type: integer, minimum: 1, maximum: 825 }
        issuer_ref: { type: string, minLength: 1, maxLength: 200 }
        identity_id: { type: [string, "null"], format: uuid }
        reason: { type: string, minLength: 1 }
        challenge_id: { type: [string, "null"], format: uuid }
        reauth_password: { type: [string, "null"] }

    RotateCertificateCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, certificate_id, expected_version, validity_days, reason]
      x-requirement-ids: [KEY-FR-009]
      properties:
        idempotency_key: { type: string, minLength: 1 }
        certificate_id: { type: string, format: uuid }
        expected_version: { type: integer, minimum: 1 }
        validity_days: { type: integer, minimum: 1, maximum: 825 }
        reason: { type: string, minLength: 1 }
        challenge_id: { type: [string, "null"], format: uuid }
        reauth_password: { type: [string, "null"] }

    RevokeCertificateCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, certificate_id, expected_version, revocation_reason, reason]
      x-requirement-ids: [KEY-FR-010]
      properties:
        idempotency_key: { type: string, minLength: 1 }
        certificate_id: { type: string, format: uuid }
        expected_version: { type: integer, minimum: 1 }
        revocation_reason:
          type: string
          enum: [KEY_COMPROMISE, CA_COMPROMISE, AFFILIATION_CHANGED, SUPERSEDED, CESSATION_OF_OPERATION, PRIVILEGE_WITHDRAWN, UNSPECIFIED]
        reason: { type: string, minLength: 1 }
        challenge_id: { type: [string, "null"], format: uuid }
        reauth_password: { type: [string, "null"] }

    CryptoHealthReport:
      type: object
      additionalProperties: false
      required: [checked_at, healthy, active_certificate_count, findings]
      x-requirement-ids: [KEY-FR-028]
      properties:
        checked_at: { type: string, format: date-time }
        healthy: { type: boolean }
        effective_crypto_profile: { type: [string, "null"] }
        active_certificate_count: { type: integer }
        findings:
          type: array
          items:
            type: object
            properties:
              check: { type: string }
              severity: { type: string }
              detail: { type: string }
