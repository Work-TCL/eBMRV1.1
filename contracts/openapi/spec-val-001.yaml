components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    DeliverableInput:
      type: object
      additionalProperties: false
      required: [artifact_type, risk_condition, owner, evidence_type]
      x-requirement-ids: [VAL-FR-006, VAL-FR-008]
      properties:
        artifact_type: { type: string }
        risk_condition: { type: string }
        owner: { type: string }
        review_required: { type: boolean, default: false }
        signature_required: { type: boolean, default: false }
        evidence_type: { type: string }
        release_blocker: { type: boolean, default: true }

    CreateOrUpdateMasterPlanCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, plan_number, scope, methodology]
      x-requirement-ids: [VAL-FR-001, VAL-FR-005, VAL-FR-006]
      properties:
        idempotency_key: { type: string }
        plan_id: { type: [string, 'null'], format: uuid }
        expected_version: { type: [integer, 'null'] }
        plan_number: { type: string }
        scope: { type: string }
        regulatory_profiles: { type: array, items: { type: string } }
        methodology: { type: string }
        responsibilities: { type: object }
        retention_class: { type: [string, 'null'] }
        new_deliverables: { type: array, items: { $ref: '#/components/schemas/DeliverableInput' } }

    ReleaseMasterPlanCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, plan_id, expected_version, reason, challenge_id, reauth_password]
      x-requirement-ids: [VAL-FR-020, VAL-FR-024]
      properties:
        idempotency_key: { type: string }
        plan_id: { type: string, format: uuid }
        expected_version: { type: integer }
        reason: { type: string }
        challenge_id: { type: string, format: uuid }
        reauth_password: { type: string }

    ReleaseGateView:
      type: object
      additionalProperties: false
      required: [plan_id, plan_state, blockers, gate_state, required_artifacts]
      x-requirement-ids: [VAL-FR-020, VAL-FR-024]
      properties:
        plan_id: { type: string, format: uuid }
        plan_state: { type: string }
        blockers: { type: array, items: { type: string } }
        gate_state: { type: string, enum: [PASSED, BLOCKED] }
        required_artifacts: { type: array, items: { type: string } }

    PackageView:
      type: object
      additionalProperties: false
      required: [plan_number, state, scope, methodology, gate]
      x-requirement-ids: [VAL-FR-023]
      properties:
        plan_number: { type: string }
        state: { type: string }
        scope: { type: string }
        methodology: { type: string }
        gate: { $ref: '#/components/schemas/ReleaseGateView' }

    SignatureChallengeRequest:
      type: object
      additionalProperties: false
      description: Body of a validation-platform signature-challenge endpoint.
      x-requirement-ids: [SIG-FR-005]
      required: [action]
      properties:
        action: { type: string, description: One of the record's allowed signed actions (e.g. release / approve / create / deployment_check). }

    IssueReleaseAuthorizationChallengeBody:
      type: object
      description: >
        The exact field set later submitted to `POST /releases/{vsr_id}/authorize`; the challenge hash
        is computed over it, so any later difference invalidates the challenge. Shape mirrors
        `IssueValidatedReleaseAuthorizationCommand` (minus `idempotency_key`); not closed here because
        that command's field set evolves with the validation-platform build.
      x-requirement-ids: [SIG-FR-005, SIG-FR-010]

    SignatureChallengeResponse:
      type: object
      description: The challenge receipt (response schema, not closed).
      x-requirement-ids: [SIG-FR-005, SIG-FR-027]
      required: [challenge_id, meaning, expires_at]
      properties:
        challenge_id: { type: string, format: uuid }
        meaning: { type: string }
        expires_at: { type: string, format: date-time }

    SignatureChallengeWithNewRecordResponse:
      type: object
      description: Signed-CREATE challenge receipt — carries the pre-generated record id.
      x-requirement-ids: [SIG-FR-005, SIG-FR-027]
      required: [challenge_id, meaning, expires_at, new_record_id]
      properties:
        challenge_id: { type: string, format: uuid }
        meaning: { type: string }
        expires_at: { type: string, format: date-time }
        new_record_id: { type: string, format: uuid }
