openapi: 3.1.0
info:
  title: SPEC-ERP-006 — Integration Gateway Contract Surface (Documents 48-53)
  version: 0.1.0
  description: >
    Document 113 §6: Document 53 owns the only public contract surface for the WP-07 package. Documents
    48 (architecture/ownership), 49/50/51 (ERPNext/SAP/Oracle Fusion/Dynamics 365/generic adapters) and 52
    (master-data sync) have "no independent API" — every one of their operations is realized through the
    endpoints declared here, dispatched internally to the vendor-neutral ERPProvider adapter resolved from
    each ErpInstance's own `vendor` column (app/modules/erp/commands.py::build_adapter). Entities backing
    this contract are a provisional schema (SG-121/ADR-0009) pending a human Document 112 amendment.
tags:
  - name: instances
  - name: mappings
  - name: commands
  - name: events
  - name: reconciliation

paths:
  /integration/v1/instances:
    post:
      operationId: registerERPInstance
      tags: [instances]
      summary: Register an ERP instance (ERP-ARC-002)
      x-requirement-ids: [ERP-ARC-002, ERP-ARC-003]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterERPInstanceCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Unrecognized vendor, or duplicate instance_name (ERP_INSTANCE_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/instances/{instance_id}:
    get:
      operationId: getERPInstance
      tags: [instances]
      summary: Read an ERP instance
      x-requirement-ids: [ERP-ARC-002]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErpInstanceView' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integration/v1/instances/{instance_id}/capabilities:
    get:
      operationId: getCapabilities
      tags: [instances]
      summary: Discover the adapter's declared/reachable capabilities (ERP-ARC-003/030)
      x-requirement-ids: [ERP-ARC-003, ERP-ARC-030]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ERPCapabilities' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integration/v1/instances/{instance_id}/validate:
    post:
      operationId: validateERPInstance
      tags: [instances]
      summary: Certify a GENERIC (custom) connector against an acceptance profile before it may post writes (MULTI-FR-024)
      description: >
        WP-07 completion pass. Unsigned (SG-122 precedent). Only meaningful for vendor=GENERIC -- a
        named-vendor instance's adapter code is its own certification. Fails with 422 if the instance
        declares a write operation in its endpoint_map with no corresponding read/sync operation
        (MULTI-FR-022).
      x-requirement-ids: [MULTI-FR-022, MULTI-FR-024, MUT-FR-005, MUT-FR-009, MUT-FR-010]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateERPInstanceCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Not a GENERIC instance, or write-capable with no declared read/reconciliation path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/instances/{instance_id}/sla-metrics:
    get:
      operationId: getIntegrationSLAMetrics
      tags: [instances]
      summary: Oldest pending/dead-letter/reconciliation ages for this instance (INT-FR-021)
      description: >
        WP-07 completion pass. Read/reporting only -- observability metrics, not a regulated decision
        read from a projection (rule 11 governs decisions, not counts/ages).
      x-requirement-ids: [INT-FR-021]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSLAMetrics' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integration/v1/instances/{instance_id}/data-quality-metrics:
    get:
      operationId: getMasterDataQualityMetrics
      tags: [instances]
      summary: Unmapped/conflict/stale/failed-sync/duplicate rates for this instance (MDS-FR-026)
      description: WP-07 completion pass. Read/reporting only, same footing as sla-metrics above.
      x-requirement-ids: [MDS-FR-026]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataQualityMetrics' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integration/v1/mappings:
    post:
      operationId: proposeMapping
      tags: [mappings]
      summary: Propose an external mapping (MDS-FR-008/009, ERP-ARC-005)
      x-requirement-ids: [MDS-FR-008, MDS-FR-009, ERP-ARC-005]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeMappingCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A proposed or active mapping already exists for this external identity (ERP_MAPPING_CONFLICT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /integration/v1/mappings/{mapping_id}/approve:
    post:
      operationId: approveMapping
      tags: [mappings]
      summary: Approve a proposed/suspended mapping (MDS-FR-019/020/021)
      x-requirement-ids: [MDS-FR-019, MDS-FR-020, MDS-FR-021]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveMappingCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale version, or mapping not in PROPOSED/SUSPENDED state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/mappings/{mapping_id}/external-change:
    post:
      operationId: applyERPProjectionUpdate
      tags: [mappings]
      summary: Apply an externally-observed field change (MDS-FR-006/007)
      x-requirement-ids: [MDS-FR-006, MDS-FR-007]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyExternalChangeCommand' }
      responses:
        '200':
          description: >
            OK — ERP-owned field updates the projection (ERPProjectionUpdated); GxP-owned field creates a
            conflict instead (MasterDataConflictDetected), never an overwrite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '409':
          description: Stale version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/mapping-conflicts/{conflict_id}/resolve:
    post:
      operationId: resolveMasterConflict
      tags: [mappings]
      summary: Resolve a master-data mapping conflict (MDS-FR-018)
      x-requirement-ids: [MDS-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveMasterConflictCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: resolution_reason missing, or resolution not one of ACCEPT_PROPOSED/KEEP_CURRENT/REJECT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/sync-checkpoints:
    post:
      operationId: advanceSyncCheckpoint
      tags: [mappings]
      summary: Advance a master-data sync checkpoint (MDS-FR-022/023)
      x-requirement-ids: [MDS-FR-022, MDS-FR-023]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvanceSyncCheckpointCommand' }
      responses:
        '200':
          description: OK — idempotent on a resubmitted idempotency_key/batch_id (crash/restart safe)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }

  /integration/v1/commands:
    post:
      operationId: queueERPCommand
      tags: [commands]
      summary: Queue an outbound ERP command (ERP-ARC-021, INT-FR-001/006)
      x-requirement-ids: [ERP-ARC-021, INT-FR-001, INT-FR-006, INT-FR-007]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueERPCommandCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '422':
          description: Instance not ACTIVE, or command_type not in the adapter's declared capabilities (ERP_CAPABILITY_UNSUPPORTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Same idempotency_key reused with a different payload (ERP_EXTERNAL_CONFLICT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/commands/{command_id}:
    get:
      operationId: getIntegrationCommand
      tags: [commands]
      summary: Read an integration command's ledger state
      x-requirement-ids: [INT-FR-001]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationCommandView' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integration/v1/commands/{command_id}/dispatch:
    post:
      operationId: dispatchERPCommand
      tags: [commands]
      summary: Dispatch a pending/retry-waiting command (ERP-ARC-023/024, INT-FR-003/004/008/012)
      x-requirement-ids: [ERP-ARC-023, ERP-ARC-024, ERP-ARC-026, INT-FR-003, INT-FR-004, INT-FR-005, INT-FR-008, INT-FR-012, INT-FR-030]
      security: [{ bearerAuth: [] }]
      description: >
        Never reports SUCCEEDED until the real outbound call has been confirmed (INT-FR-030 "no silent
        success"). Runs as two separate committed transactions around the actual HTTP call — see
        app/modules/erp/commands.py::dispatch_erp_command's docstring.
      responses:
        '200':
          description: OK — resulting command state is SUCCEEDED, RETRY_WAIT or DEAD_LETTER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Command not in PENDING/RETRY_WAIT state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Per-instance/operation circuit breaker is OPEN (INT-FR-022)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/commands/{command_id}/retry:
    post:
      operationId: retryERPCommand
      tags: [commands]
      summary: Manually retry a failed/dead-lettered/retry-waiting command (INT-FR-013/027)
      x-requirement-ids: [ERP-ARC-027, INT-FR-013, INT-FR-027]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryERPCommandCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '422':
          description: reason is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/commands/{command_id}/cancel:
    post:
      operationId: cancelPendingERPCommand
      tags: [commands]
      summary: Cancel a pending/retry-waiting command before external commit (ERP-ARC-027, INT-FR-015)
      x-requirement-ids: [ERP-ARC-027, INT-FR-015]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelPendingERPCommandCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '409':
          description: Command already DISPATCHED/SUCCEEDED — can no longer be cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/commands/{command_id}/correct:
    post:
      operationId: createCorrectedCommand
      tags: [commands]
      summary: Create a corrected replacement command from a terminal one (INT-FR-014)
      x-requirement-ids: [INT-FR-014]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCorrectedCommandCommand' }
      responses:
        '200':
          description: OK — a brand-new command linked via correction_of_id; the original is never mutated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }

  /integration/v1/commands/{command_id}/compensate:
    post:
      operationId: createCompensationCommand
      tags: [commands]
      summary: Create a new command reversing an already-succeeded one, tied to a GxP correction/disposition (INT-FR-016)
      description: >
        WP-07 completion pass. Distinct from /correct: a correction resends the same logical operation
        after a failure; a compensation reverses an operation that already succeeded externally. Always a
        brand-new command (never mutates the original), and always carries gxp_authorization_reference --
        the authorizing GxP correction/disposition record.
      x-requirement-ids: [INT-FR-016, MUT-FR-005, MUT-FR-010, MUT-FR-011]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompensationCommandCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Original command has not succeeded -- nothing to reverse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Missing reason or gxp_authorization_reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/commands/{command_id}/reconcile-uncertain:
    post:
      operationId: reconcileUncertainCommit
      tags: [commands]
      summary: Recover a command stuck DISPATCHED after an uncertain-timeout crash (INT-FR-008)
      x-requirement-ids: [INT-FR-008]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK — moves to RETRY_WAIT with required_next_action demanding external verification; never blindly resumes as PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '409':
          description: Command not in DISPATCHED state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/events:
    post:
      operationId: ingestERPEvent
      tags: [events]
      summary: Ingest an inbound ERP event (ERP-ARC-022, INT-FR-010/011)
      x-requirement-ids: [ERP-ARC-022, INT-FR-010, INT-FR-011]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestERPEventCommand' }
      responses:
        '200':
          description: OK — a resubmission with the same external_event_id and payload is an idempotent no-op
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '409':
          description: Same external_event_id reused with a different payload (ERP_EXTERNAL_CONFLICT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/reconciliation-runs:
    post:
      operationId: createReconciliationRun
      tags: [reconciliation]
      summary: Start a reconciliation run (ERP-ARC-025, INT-FR-017/018)
      x-requirement-ids: [ERP-ARC-025, INT-FR-017, INT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReconciliationRunCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }

  /integration/v1/reconciliation-runs/{run_id}/differences:
    post:
      operationId: recordReconciliationDifference
      tags: [reconciliation]
      summary: Record a reconciliation difference (INT-FR-017)
      x-requirement-ids: [INT-FR-017]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordReconciliationDifferenceCommand' }
      responses:
        '200':
          description: OK — always created resolution_status=OPEN, never auto-resolved (INT-FR-019, SG-124)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }

  /integration/v1/reconciliation-differences/{difference_id}/resolve:
    post:
      operationId: resolveReconciliationDifference
      tags: [reconciliation]
      summary: Resolve a reconciliation difference (INT-FR-019/020)
      x-requirement-ids: [INT-FR-019, INT-FR-020]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveReconciliationDifferenceCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '422':
          description: resolution_reason missing, or resolution_status is AUTO_RESOLVED (never accepted — SG-124)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/reconciliation-runs/{run_id}/complete:
    post:
      operationId: completeReconciliationRun
      tags: [reconciliation]
      summary: Complete a reconciliation run
      x-requirement-ids: [ERP-ARC-025, INT-FR-017]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteReconciliationRunCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }

  /integration/v1/bulk-jobs:
    post:
      operationId: startBulkJob
      tags: [bulk-jobs]
      summary: Start a bulk import/export job with a resumable idempotency handle (INT-FR-023)
      description: >
        WP-07 completion pass. idempotency_key doubles as the resume handle -- calling this again with
        the same key after a crash returns the existing job (with its resume_cursor) rather than starting
        a second one.
      x-requirement-ids: [INT-FR-023, MUT-FR-005, MUT-FR-010]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartBulkJobCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Unrecognized job_type or entity_type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/bulk-jobs/{job_id}/progress:
    post:
      operationId: recordBulkJobProgress
      tags: [bulk-jobs]
      summary: Record one processed chunk's successes/failures/resume position (INT-FR-023)
      description: >
        WP-07 completion pass. newly_failed_records (this chunk only) is appended, never replaced;
        successes are only ever counted, never individually retained.
      x-requirement-ids: [INT-FR-023, MUT-FR-005, MUT-FR-009, MUT-FR-010]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordBulkJobProgressCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale version, or job is not RUNNING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/bulk-jobs/{job_id}/complete:
    post:
      operationId: completeBulkJob
      tags: [bulk-jobs]
      summary: Complete a bulk job -- COMPLETED if failed_count is zero, COMPLETED_WITH_ERRORS otherwise (INT-FR-023)
      x-requirement-ids: [INT-FR-023, MUT-FR-005, MUT-FR-009, MUT-FR-010]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteBulkJobCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale version, or job is not RUNNING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /integration/v1/migration-packages:
    post:
      operationId: recordMigrationPackage
      tags: [migration-packages]
      summary: Record customer onboarding mapping/import package provenance (MDS-FR-028)
      description: >
        WP-07 completion pass. No dedicated workflow function exists in Document 52's own catalogue for
        this -- a provenance record, not a workflow. approved_by_user_id is set only when the caller
        supplies approval_reference.
      x-requirement-ids: [MDS-FR-028, MUT-FR-005, MUT-FR-010]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordMigrationPackageCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '422':
          description: Missing package_name or source_checksum
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: No or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated actor's roles do not grant this action (ROLE_MISSING)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: Request failed schema or business validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      x-requirement-ids: [CTR-FR-006]
      required: [code, message, details]
