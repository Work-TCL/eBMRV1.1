openapi: 3.1.0
info:
  title: SPEC-SEC-001 — Security Architecture, Threat Model & Control Framework
  version: 0.1.0
  description: >
    Document 113 contract for WP-10 Document 61 (`services/gxp-api/app/modules/security/`). 4 owned
    entities per the approved data-model catalogue: `security_threat_model_version`, `security_threat`,
    `security_control`, `security_exception`.


    `triggerThreatModelReview()` and `calculateSecurityRisk()` are named functions with their own events
    in Document 61's contract catalogue but are missing from its terse 6-op `# 7` list — contracted here
    as extra operations under their owning aggregate's path, same precedent Document 54/58 used for their
    own extra read/analytics endpoints. A read-only `GET /security/v1/exceptions/{id}` is likewise added
    (not named in `# 7`, same "extra read operation" precedent).


    `mapSecurityControl()`, `calculateSecurityRisk()`, `acceptResidualSecurityRisk()` and
    `triggerThreatModelReview()` have no dedicated owned table (only 4 entities exist for 8 functions) —
    see `app/modules/security/models.py`'s module docstring for how each is represented on the 4 owned
    tables instead.


    SG-161 RESOLVED_APPROVED 2026-09-14 (project-owner-directed): `acceptResidualSecurityRisk` and the
    former `openSecurityException` now resolve to a real "Security Risk Approver" signature, independent
    of whoever's judgment is being approved. Independence has no meaning in a single-step create+sign
    command, so `openSecurityException` was split into an unsigned `requestSecurityException()`
    (`POST /security/v1/exceptions`, records the requester) and a signed `approveSecurityException()`
    (`POST /security/v1/exceptions/{exception_id}/approve`, independence-checked against that requester).
tags:
  - name: security

paths:
  /security/v1/threat-models:
    post:
      operationId: postCreateThreatModelVersion
      tags: [security]
      summary: Create a draft threat model version (SEC-THR-001/002/003/004/005/019/025)
      x-requirement-ids: [SEC-THR-001, SEC-THR-002, SEC-THR-003, SEC-THR-004, SEC-THR-005, SEC-THR-019, SEC-THR-025, MUT-FR-005, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateThreatModelVersionCommand' } } }
      responses:
        '200': { description: Draft created., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '422': { description: "THREAT_SCOPE_INVALID.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/threat-models/{threat_model_version_id}/reviews:
    post:
      operationId: postTriggerThreatModelReview
      tags: [security]
      summary: Trigger a threat model review (SEC-THR-002/024)
      x-requirement-ids: [SEC-THR-002, SEC-THR-024, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: threat_model_version_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TriggerThreatModelReviewCommand' } } }
      responses:
        '200': { description: Review task recorded., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: STALE_VERSION., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: VALIDATION_FAILED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/control-matrix:
    get:
      operationId: getSecurityControlMatrix
      tags: [security]
      summary: Generate the threat/control/evidence/test matrix for a threat model version (SEC-THR-013/027)
      description: Read-only join over security_threat.control_mappings and the security_control catalogue (AG-11 — never a regulated decision source).
      x-requirement-ids: [SEC-THR-013, SEC-THR-027]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: threat_model_version_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: deployment_profile, in: query, required: false, schema: { type: string, enum: [CLOUD, PRIVATE_CLOUD, ON_PREM] } }
      responses:
        '200': { description: Control matrix., content: { application/json: { schema: { $ref: '#/components/schemas/SecurityControlMatrix' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '422': { description: VALIDATION_FAILED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/threats:
    post:
      operationId: postRegisterThreat
      tags: [security]
      summary: Register a threat against a threat model version (SEC-THR-003..012)
      x-requirement-ids: [SEC-THR-003, SEC-THR-004, SEC-THR-005, SEC-THR-006, SEC-THR-007, SEC-THR-008, SEC-THR-009, SEC-THR-010, SEC-THR-011, SEC-THR-012, MUT-FR-005, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterThreatCommand' } } }
      responses:
        '200': { description: Threat registered., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '422': { description: VALIDATION_FAILED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/threats/{threat_id}/controls:
    post:
      operationId: postMapSecurityControl
      tags: [security]
      summary: Map a preventive/detective/recovery control to a threat (SEC-THR-013)
      description: Gets-or-creates the security_control catalogue entry by control_code (no createSecurityControl() function exists — see models.py module docstring).
      x-requirement-ids: [SEC-THR-013, SEC-THR-022, SEC-THR-028, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: threat_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MapSecurityControlCommand' } } }
      responses:
        '200': { description: Control mapped., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: STALE_VERSION., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: VALIDATION_FAILED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/threats/{threat_id}/risk-calculations:
    post:
      operationId: postCalculateSecurityRisk
      tags: [security]
      summary: Calculate inherent or residual security risk for a threat (SEC-THR-014)
      description: rating is caller-supplied (no risk-scoring formula/matrix is defined in any approved baseline — same established precedent as app/modules/qms/risk_commands.py). Appends the prior value onto risk_calculation_history rather than overwriting it.
      x-requirement-ids: [SEC-THR-014, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: threat_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalculateSecurityRiskCommand' } } }
      responses:
        '200': { description: Risk calculated., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: STALE_VERSION., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: "SECURITY_RISK_INPUT_INCOMPLETE or VALIDATION_FAILED.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/risks/{risk_id}/accept:
    post:
      operationId: postAcceptResidualSecurityRisk
      tags: [security]
      summary: Accept residual security risk (SEC-THR-015)
      description: risk_id is the owning security_threat id (no separate SecurityRiskAssessment table). SG-161 RESOLVED_APPROVED 2026-09-14 — signed by "Security Risk Approver", independent of residual_risk.calculated_by.
      x-requirement-ids: [SEC-THR-015, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-012, MUT-FR-013, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: risk_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptResidualSecurityRiskCommand' } } }
      responses:
        '200': { description: Residual risk accepted., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { description: "FORBIDDEN, ROLE_MISSING (not Security Risk Approver) or SOD_INDEPENDENCE_REQUIRED (same actor calculated the risk).", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: STALE_VERSION., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: SECURITY_RISK_INPUT_INCOMPLETE., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '428': { description: MISSING_SIGNATURE., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/risks/{risk_id}/accept-signature-challenges:
    post:
      operationId: postAcceptRiskSignatureChallenge
      tags: [security]
      summary: Create the signature challenge for accepting a residual security risk (SIG-FR-005)
      x-requirement-ids: [SEC-THR-015, SIG-FR-005]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: risk_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Challenge created., content: { application/json: { schema: { $ref: '#/components/schemas/SignatureChallengeResult' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

  /security/v1/exceptions:
    post:
      operationId: postRequestSecurityException
      tags: [security]
      summary: Request a time-bounded security exception (SEC-THR-023)
      description: SG-161 RESOLVED_APPROVED 2026-09-14 — unsigned request half (records the requester); see postApproveSecurityException for the signed approval half.
      x-requirement-ids: [SEC-THR-023, MUT-FR-005, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RequestSecurityExceptionCommand' } } }
      responses:
        '200': { description: Exception requested (state PENDING_APPROVAL)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '422': { description: "VALIDATION_FAILED (e.g. expiry in the past).", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/exceptions/{exception_id}/approval-signature-challenges:
    post:
      operationId: postApproveExceptionSignatureChallenge
      tags: [security]
      summary: Create the signature challenge for approving a requested security exception (SIG-FR-005)
      x-requirement-ids: [SEC-THR-023, SIG-FR-005]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: exception_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Challenge created., content: { application/json: { schema: { $ref: '#/components/schemas/SignatureChallengeResult' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

  /security/v1/exceptions/{exception_id}/approve:
    post:
      operationId: postApproveSecurityException
      tags: [security]
      summary: Approve a requested security exception (SEC-THR-023)
      description: SG-161 RESOLVED_APPROVED 2026-09-14 — signed by "Security Risk Approver", independent of the exception's opened_by (the requester). Moves state PENDING_APPROVAL -> OPEN.
      x-requirement-ids: [SEC-THR-023, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-012, MUT-FR-013, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: exception_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApproveSecurityExceptionCommand' } } }
      responses:
        '200': { description: Exception approved (state OPEN)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { description: "FORBIDDEN, ROLE_MISSING (not Security Risk Approver) or SOD_INDEPENDENCE_REQUIRED (same actor requested it).", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: STALE_VERSION or wrong state (not PENDING_APPROVAL)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '428': { description: MISSING_SIGNATURE., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /security/v1/exceptions/{exception_id}:
    get:
      operationId: getSecurityException
      tags: [security]
      summary: Read a security exception (SEC-THR-023/027)
      x-requirement-ids: [SEC-THR-023, SEC-THR-027]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: exception_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Exception., content: { application/json: { schema: { $ref: '#/components/schemas/SecurityExceptionView' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

components:
  schemas:
    CreateThreatModelVersionCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6).
      x-requirement-ids: [SEC-THR-001, SEC-THR-025, MUT-FR-005, MUT-FR-010]
      required: [idempotency_key, system_version, methodology_version, deployment_profile]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        system_version: { type: string }
        methodology_version: { type: string }
        deployment_profile: { type: string, enum: [CLOUD, PRIVATE_CLOUD, ON_PREM] }
        scope: { type: [object, "null"] }
        assets: { type: [object, "null"] }
        boundaries: { type: [object, "null"] }
        reason: { type: [string, "null"] }

    TriggerThreatModelReviewCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6).
      x-requirement-ids: [SEC-THR-002, SEC-THR-024, MUT-FR-005, MUT-FR-009, MUT-FR-010]
      required: [idempotency_key, threat_model_version_id, expected_version, change_id, trigger_type]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        threat_model_version_id: { type: string, format: uuid }
        expected_version: { type: integer }
        change_id: { type: string }
        trigger_type: { type: string }
        affected_modules: { type: array, items: { type: string } }
        reason: { type: [string, "null"] }

    RegisterThreatCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6).
      x-requirement-ids: [SEC-THR-003, SEC-THR-004, SEC-THR-005, SEC-THR-006, MUT-FR-005, MUT-FR-010]
      required: [idempotency_key, threat_model_version_id, asset_or_boundary, threat_type, abuse_case]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        threat_model_version_id: { type: string, format: uuid }
        asset_or_boundary: { type: string }
        threat_type: { type: string, enum: [SPOOFING, TAMPERING, REPUDIATION, INFORMATION_DISCLOSURE, DENIAL_OF_SERVICE, ELEVATION_OF_PRIVILEGE, OTHER] }
        abuse_case: { type: string }
        attack_preconditions: { type: [object, "null"] }
        impacted_attributes: { type: array, items: { type: string } }
        evidence: { type: [object, "null"] }
        reason: { type: [string, "null"] }

    MapSecurityControlCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6).
      x-requirement-ids: [SEC-THR-013, MUT-FR-005, MUT-FR-009, MUT-FR-010]
      required: [idempotency_key, threat_id, expected_version, control_code, mapping_type]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        threat_id: { type: string, format: uuid }
        expected_version: { type: integer }
        control_code: { type: string }
        mapping_type: { type: string, enum: [PREVENTIVE, DETECTIVE, RECOVERY] }
        implementation_refs: { type: [object, "null"] }
        objective: { type: [string, "null"] }
        implementation_owner: { type: [string, "null"] }
        evidence_source: { type: [string, "null"] }
        test_owner: { type: [string, "null"] }
        framework_mappings: { type: [object, "null"] }
        reason: { type: [string, "null"] }

    CalculateSecurityRiskCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6).
      x-requirement-ids: [SEC-THR-014, MUT-FR-005, MUT-FR-009, MUT-FR-010]
      required: [idempotency_key, threat_id, expected_version, risk_stage, impact_inputs, likelihood_inputs, methodology, rating]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        threat_id: { type: string, format: uuid }
        expected_version: { type: integer }
        risk_stage: { type: string, enum: [INHERENT, RESIDUAL] }
        impact_inputs: { type: object }
        likelihood_inputs: { type: object }
        methodology: { type: string }
        rating: { type: object }
        reason: { type: [string, "null"] }

    AcceptResidualSecurityRiskCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6).
      x-requirement-ids: [SEC-THR-015, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-012, MUT-FR-013]
      required: [idempotency_key, risk_id, expected_version, rationale]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        risk_id: { type: string, format: uuid }
        expected_version: { type: integer }
        rationale: { type: string }
        expiry_review_date: { type: [string, "null"], format: date-time }
        challenge_id: { type: [string, "null"], format: uuid }
        reauth_password: { type: [string, "null"] }

    RequestSecurityExceptionCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6). Unsigned request half of the SG-161 request/approve split.
      x-requirement-ids: [SEC-THR-023, MUT-FR-005, MUT-FR-010]
      required: [idempotency_key, control_or_requirement, reason, expiry]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        control_or_requirement: { type: string }
        reason: { type: string }
        expiry: { type: string, format: date-time }
        risk_assessment_ref: { type: [object, "null"] }
        compensating_controls: { type: [object, "null"] }
        remediation_target: { type: [object, "null"] }

    ApproveSecurityExceptionCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6). Signed approval half of the SG-161 request/approve split.
      x-requirement-ids: [SEC-THR-023, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-012, MUT-FR-013]
      required: [idempotency_key, expected_version]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        expected_version: { type: integer }
        challenge_id: { type: [string, "null"], format: uuid }
        reauth_password: { type: [string, "null"] }

    SignatureChallengeResult:
      type: object
      description: The challenge receipt returned by this module's signature-challenge endpoints (response schema, so not closed).
      x-requirement-ids: [SIG-FR-005, SIG-FR-027]
      required: [challenge_id, meaning, expires_at]
      properties:
        challenge_id: { type: string, format: uuid }
        meaning: { type: string }
        expires_at: { type: string, format: date-time }

    SecurityControlMatrix:
      type: object
      x-requirement-ids: [SEC-THR-013, SEC-THR-027]
      properties:
        threat_model_version_id: { type: string, format: uuid }
        deployment_profile: { type: string }
        generated_at: { type: string, format: date-time }
        entries: { type: array, items: { type: object } }

    SecurityExceptionView:
      type: object
      x-requirement-ids: [SEC-THR-023]
      properties:
        id: { type: string, format: uuid }
        control_or_requirement: { type: string }
        state: { type: string }
        expiry: { type: string, format: date-time }
        reason: { type: string }
        version: { type: integer }
