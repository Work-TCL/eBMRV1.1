openapi: 3.1.0
info:
  title: SPEC-QMS-002 — CAPA Management
  version: 0.1.0
  description: >
    Document 113 contract for the WP-05 Document 27 slice actually built
    (`services/gxp-api/app/modules/qms/capa_*.py`): the linear OPEN -> PLAN -> IMPLEMENTATION ->
    IMPLEMENTATION_VERIFIED -> EFFECTIVENESS_MONITORING -> EFFECTIVENESS_REVIEW -> CLOSED pipeline plus
    EFFECTIVENESS_FAILED -> REOPENED/IMPLEMENTATION and CLOSED -> REOPENED, matching the module's own
    8-op API list exactly, plus the `signature-challenges` ceremony-entry-point endpoint (SG-138
    engineering half, not in Document 27's own list — contracted because the router implements it).


    CAPA-FR-008(partial)/014/020/021(partial)/022 are deliberately not built — see
    docs/generated/18_SPEC_GAPS.md SG-063/SG-064/SG-065 and SG-062. Only `close`/`cancel` is actually
    signed (CAPA_SIGNATURE_ACTIONS = `("close",)`); Document 27's broader CAPA-FR-021 ("plan approval,
    extension, effectiveness ... signed per policy") is narrower in the built module — `plan`, `extend`
    and defining/recording an effectiveness check are all unsigned RBAC-only actions. `close` returns
    `SIGNATURE_POLICY_UNRESOLVED` today — SG-138's policy-data half is still open.
tags:
  - name: qms-capa

paths:
  /qms/v1/capas:
    post:
      operationId: postCreateCapa
      tags: [qms-capa]
      summary: Initiate a CAPA from any of Document 27's declared sources (CAPA-FR-001/002/003/004)
      description: Requires `capa.create`. `source_type` must be one of deviation/oos/oot/ncr/complaint/audit/supplier/risk/trend/security/validation. `root_cause_ref` must carry `investigation_ref` or `proactive_rationale`.
      x-requirement-ids: [CAPA-FR-001, CAPA-FR-002, CAPA-FR-003, CAPA-FR-004, MUT-FR-005, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCapaCommand' } } }
      responses:
        '200': { description: Created, state OPEN. `aggregate_id` is the capa id., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '409': { description: IDEMPOTENCY_CONFLICT., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: "VALIDATION_FAILED, CAPA_SOURCE_REQUIRED, or CAPA_ROOT_CAUSE_REQUIRED.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

    get:
      operationId: getCapas
      tags: [qms-capa]
      summary: Paginated, filterable CAPA list (non-authoritative read, AG-11)
      x-requirement-ids: [CAPA-FR-019]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: 'spec-gxp-001.yaml#/components/parameters/Page' }
        - { $ref: 'spec-gxp-001.yaml#/components/parameters/PageSize' }
        - { $ref: 'spec-gxp-001.yaml#/components/parameters/Query' }
        - { $ref: 'spec-gxp-001.yaml#/components/parameters/SortBy' }
        - { $ref: 'spec-gxp-001.yaml#/components/parameters/SortDir' }
        - { name: site_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/CapaState' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CapaListResult' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }

  /qms/v1/capas/{capa_id}:
    parameters:
      - { name: capa_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCapaDetail
      tags: [qms-capa]
      summary: One CAPA with full detail, actions and effectiveness checks (CAPA-FR-007/010/018/022)
      x-requirement-ids: [CAPA-FR-007, CAPA-FR-010, CAPA-FR-018, CAPA-FR-022]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CapaDetail' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

  /qms/v1/capas/{capa_id}/plan:
    parameters:
      - { name: capa_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postPlanCapa
      tags: [qms-capa]
      summary: Capture corrective/preventive action and the effectiveness plan (CAPA-FR-005/006/010)
      description: Requires `capa.plan`. OPEN -> PLAN only.
      x-requirement-ids: [CAPA-FR-005, CAPA-FR-006, CAPA-FR-010, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlanCapaCommand' } } }
      responses:
        '200': { description: Planned., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION, IDEMPOTENCY_CONFLICT, or INVALID_TRANSITION.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: "VALIDATION_FAILED (corrective_action.description required) or capa_id path/body mismatch.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /qms/v1/capas/{capa_id}/actions:
    parameters:
      - { name: capa_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postAddCapaAction
      tags: [qms-capa]
      summary: Add a CAPA action with owner, due date and dependency links (CAPA-FR-005/006/007/008)
      description: Requires `capa.action.add`. PLAN/IMPLEMENTATION -> IMPLEMENTATION.
      x-requirement-ids: [CAPA-FR-005, CAPA-FR-006, CAPA-FR-007, CAPA-FR-008, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddCapaActionCommand' } } }
      responses:
        '200': { description: Added., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION, IDEMPOTENCY_CONFLICT, or INVALID_TRANSITION.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: "VALIDATION_FAILED (unrecognized action_type, blank description) or capa_id path/body mismatch.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /qms/v1/actions:
    get:
      operationId: getCapaActions
      tags: [qms-capa]
      summary: Cross-CAPA action worklist, or one CAPA's actions via capa_id (CAPA-FR-019, "my open actions")
      x-requirement-ids: [CAPA-FR-007, CAPA-FR-019]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: 'spec-gxp-001.yaml#/components/parameters/Page' }
        - { $ref: 'spec-gxp-001.yaml#/components/parameters/PageSize' }
        - { $ref: 'spec-gxp-001.yaml#/components/parameters/Query' }
        - { name: capa_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/CapaActionState' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CapaActionListResult' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }

  /qms/v1/actions/{action_id}/complete:
    parameters:
      - { name: action_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postCompleteCapaAction
      tags: [qms-capa]
      summary: Mark an action complete with verified evidence (CAPA-FR-007/008/009)
      description: Requires `capa.action.complete`. When this was the last open action for its CAPA, the CAPA advances to IMPLEMENTATION_VERIFIED.
      x-requirement-ids: [CAPA-FR-007, CAPA-FR-008, CAPA-FR-009, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompleteCapaActionCommand' } } }
      responses:
        '200': { description: "Completed. `aggregate_id`/`resulting_version` describe the CAPA, not the action, when the CAPA also advances.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION, IDEMPOTENCY_CONFLICT, INVALID_TRANSITION, or ACTION_DEPENDENCY_OPEN.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: "VALIDATION_FAILED or ACTION_EVIDENCE_REQUIRED (implementation_evidence.description required).", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /qms/v1/capas/{capa_id}/effectiveness:
    parameters:
      - { name: capa_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postCapaEffectiveness
      tags: [qms-capa]
      summary: Define an effectiveness check, or record its result (CAPA-FR-010/011/012)
      description: >
        Requires `capa.effectiveness`. Two modes on the same endpoint, distinguished by whether `result`
        is present: without it, defines a new check and moves IMPLEMENTATION_VERIFIED -> EFFECTIVENESS_
        MONITORING; with it (and `check_id`), records the check's outcome and moves to EFFECTIVENESS_
        REVIEW (pass) or EFFECTIVENESS_FAILED (fail/inconclusive).
      x-requirement-ids: [CAPA-FR-010, CAPA-FR-011, CAPA-FR-012, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EffectivenessCommand' } } }
      responses:
        '200': { description: Defined or recorded., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION, IDEMPOTENCY_CONFLICT, or INVALID_TRANSITION.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: "VALIDATION_FAILED (bad result) or EFFECTIVENESS_PLAN_REQUIRED (missing criterion/data_source/observation window/due_date to define a check, or missing evidence/check_id to record a result).", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /qms/v1/capas/{capa_id}/extend:
    parameters:
      - { name: capa_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postExtendCapa
      tags: [qms-capa]
      summary: Extend the target date, preserving the old value in history (CAPA-FR-013)
      description: Requires `capa.extend`. `new_target_date` must be later than the current `target_date`.
      x-requirement-ids: [CAPA-FR-013, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-011, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExtendCapaCommand' } } }
      responses:
        '200': { description: Extended., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION, IDEMPOTENCY_CONFLICT, or INVALID_TRANSITION.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: "VALIDATION_FAILED (reason/risk_review required, or new_target_date not later) or capa_id path/body mismatch.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /qms/v1/capas/{capa_id}/signature-challenges:
    parameters:
      - { name: capa_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postCapaSignatureChallenge
      tags: [qms-capa]
      summary: Create the Part 11 signature challenge for close/cancel (SG-138 engineering half)
      description: >
        Not in Document 27's own 8-op API list; contracted because the router implements it (the same
        signature-challenge-helper-endpoint pattern used throughout this codebase). Resolves the
        `capa_record`/`close` Document 106 policy and binds a challenge to the current CAPA
        id/version/hash. Returns `SIGNATURE_POLICY_UNRESOLVED` today (SG-138's policy-data half is still
        open).
      x-requirement-ids: [CAPA-FR-021, SIG-FR-004, SIG-FR-005, SIG-FR-010]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CapaSignatureChallengeRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SignatureChallengeResponse' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: SIGNATURE_POLICY_UNRESOLVED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: "VALIDATION_FAILED — action is not close.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /qms/v1/capas/{capa_id}/close:
    parameters:
      - { name: capa_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postCloseCapa
      tags: [qms-capa]
      summary: QA closure, or cancellation of a not-required/duplicate CAPA — signed per Document 106 (CAPA-FR-015/016/021)
      description: >
        Requires `capa.close`. `cancellation_reason` set instead of `conclusion` cancels (any
        non-terminal state -> CANCELLED) rather than closing (EFFECTIVENESS_REVIEW/REOPENED -> CLOSED);
        both paths resolve the same `capa_record`/`close` Document 106 policy.
      x-requirement-ids: [CAPA-FR-015, CAPA-FR-016, CAPA-FR-021, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-012, MUT-FR-015, MUT-FR-018, SIG-FR-004]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloseCapaCommand' } } }
      responses:
        '200': { description: Closed or cancelled., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION, IDEMPOTENCY_CONFLICT, INVALID_TRANSITION, CAPA_CLOSURE_BLOCKED, or SIGNATURE_POLICY_UNRESOLVED.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: capa_id path/body mismatch., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '428': { $ref: 'spec-gxp-001.yaml#/components/responses/MissingSignature' }

  /qms/v1/capas/{capa_id}/reopen:
    parameters:
      - { name: capa_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postReopenCapa
      tags: [qms-capa]
      summary: Reopen on recurrence or new evidence (CAPA-FR-012/017)
      description: Requires `capa.reopen`. EFFECTIVENESS_FAILED/CLOSED -> REOPENED only.
      x-requirement-ids: [CAPA-FR-012, CAPA-FR-017, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReopenCapaCommand' } } }
      responses:
        '200': { description: Reopened., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: "STALE_VERSION, IDEMPOTENCY_CONFLICT, or INVALID_TRANSITION.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: "VALIDATION_FAILED (reason/new_evidence required) or capa_id path/body mismatch.", content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    CapaState:
      type: string
      description: "`CAPA_STATES` in `app/modules/qms/capa_models.py`."
      x-requirement-ids: [CAPA-FR-001, CTR-FR-017]
      enum: [OPEN, PLAN, IMPLEMENTATION, IMPLEMENTATION_VERIFIED, EFFECTIVENESS_MONITORING, EFFECTIVENESS_REVIEW, EFFECTIVENESS_FAILED, CLOSED, CANCELLED, REOPENED]

    CapaActionState:
      type: string
      description: "`ACTION_STATES` in `app/modules/qms/capa_models.py`."
      x-requirement-ids: [CAPA-FR-007]
      enum: [open, completed]

    CapaSourceType:
      type: string
      description: "`CAPA_SOURCE_TYPES` — the eleven sources Document 27 itself enumerates (CAPA-FR-001)."
      x-requirement-ids: [CAPA-FR-001]
      enum: [deviation, oos, oot, ncr, complaint, audit, supplier, risk, trend, security, validation]

    CapaScopeType:
      type: string
      description: "`CAPA_SCOPE_TYPES` (CAPA-FR-019)."
      x-requirement-ids: [CAPA-FR-019]
      enum: [site, product, process, enterprise]

    CapaActionType:
      type: string
      description: "`ACTION_TYPES` — corrective/preventive/systemic, no artificial categorisation beyond these three (CAPA-FR-005/006)."
      x-requirement-ids: [CAPA-FR-005, CAPA-FR-006]
      enum: [corrective, preventive, systemic]

    EffectivenessResult:
      type: string
      description: "`EFFECTIVENESS_RESULTS` (CAPA-FR-011)."
      x-requirement-ids: [CAPA-FR-011]
      enum: [pass, fail, inconclusive]

    CapaAction:
      type: object
      description: One CAPA action (`app/modules/qms/capa_router.py:_action_dict`). A response schema, so not closed.
      x-requirement-ids: [CAPA-FR-007, CAPA-FR-008]
      required: [id, capa_id, action_type, description, owner_subject_id, due_date, state, version]
      properties:
        id: { type: string, format: uuid }
        capa_id: { type: string, format: uuid }
        action_type: { $ref: '#/components/schemas/CapaActionType' }
        description: { type: string }
        owner_subject_id: { type: string, format: uuid }
        due_date: { type: string, format: date-time }
        dependency_links: { type: [array, "null"], items: { type: object }, description: "{dependency_type, reference_id}; only dependency_type=capa_action is enforced (ACTION_DEPENDENCY_OPEN)." }
        implementation_evidence: { type: [object, "null"] }
        state: { $ref: '#/components/schemas/CapaActionState' }
        verification_status: { type: [string, "null"] }
        verified_by: { type: [string, "null"], format: uuid }
        verified_at: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: [string, "null"], format: date-time }

    CapaEffectivenessCheck:
      type: object
      description: One effectiveness check, as returned inline by getCapaDetail.
      x-requirement-ids: [CAPA-FR-010, CAPA-FR-011]
      required: [id, criterion, data_source, observation_start, observation_end, due_date]
      properties:
        id: { type: string, format: uuid }
        criterion: { type: string }
        data_source: { type: string }
        observation_start: { type: string, format: date-time }
        observation_end: { type: string, format: date-time }
        due_date: { type: string, format: date-time }
        result: { oneOf: [{ $ref: '#/components/schemas/EffectivenessResult' }, { type: "null" }] }
        evidence: { type: [object, "null"] }
        reviewer_subject_id: { type: [string, "null"], format: uuid }
        evaluated_at: { type: [string, "null"], format: date-time }

    Capa:
      type: object
      description: One CAPA record (`app/modules/qms/capa_router.py:_capa_dict`). A response schema, so not closed.
      x-requirement-ids: [CAPA-FR-001, CAPA-FR-002, CAPA-FR-003, CAPA-FR-019]
      required: [id, site_id, quality_event_id, capa_number, source_type, source_id, problem_statement, scope_type, risk_class, state, owner_subject_id, version]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        quality_event_id: { type: string, format: uuid }
        capa_number: { type: string }
