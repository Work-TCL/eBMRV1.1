openapi: 3.1.0
info:
  title: SPEC-EQP-002 — Cleaning, Sanitization & Line Clearance
  version: 0.1.0
  description: >
    Document 113 contract for Document 39 (`services/gxp-api/app/modules/equipment/cleaning_router.py` +
    `cleaning_commands.py` + `cleaning_models.py`) — same `equipment` module/schema as Document 38
    (AG-05, one owner per Document 04/05's catalogue). Exactly the 11 operations the code exposes across
    two route prefixes (`/cleaning/v1` and `/line-clearance/v1`, both genuinely owned by this document —
    not a cross-module routing collision like `/reconciliation/v1`). `EquipmentArea` is a new shared
    master this document introduces — a deliberately narrow "classified area" master scoped to what
    Documents 39/40/41 actually consume, not the full Document 01/02 C-003 Building/Area/Room/Line
    hierarchy (SPEC_GAP). `cleaning_procedure_version` has no create/release endpoint in this document's
    own API list — seed-only master data, same precedent as `material.WarehouseLocation`.


    APPLICATION-LEVEL CONDITIONAL REQUIREMENTS, NOT MODELED AS SCHEMA CONSTRAINTS: `reason` becomes
    required when `critical=true` on the originating execution/clearance (`SignaturePolicy.reason_required`
    is a flat boolean, not per-record conditional, so this is enforced in `complete_cleaning`/
    `complete_line_clearance`, not in the OpenAPI schema — a `VALIDATION_FAILED` at request time, not a
    schema-rejected request). `postCompleteCleaning`/`postCompleteLineClearance` carry OPTIONAL
    `challenge_id`/`reauth_password` (signature is conditional on the current Document 106 row for the
    `complete` action existing and requiring one); `postVerifyCleaning` carries them as REQUIRED fields
    (same "always-present-in-schema, policy decides at runtime" precedent as Document 38's
    `HoldEquipmentCommand`) plus a hard independence check — the verifier may never be the performer
    (SIG-FR-018).


    NOT EXPOSED AS ITS OWN OPERATION: `get_area_line_clearance_status` in `cleaning_commands.py` is an
    internal cross-module helper Document 40's aseptic readiness composition calls directly — it has no
    router registration and is not contracted here (same precedent as `em_commands.get_area_readiness`
    being the composing side of that same relationship).
tags:
  - name: cleaning

paths:
  /cleaning/v1/executions:
    post:
      operationId: postCreateCleaningExecution
      tags: [cleaning]
      summary: Start a cleaning execution (CLN-FR-003/004/005/006/007)
      description: >
        Represents "equipment/area is dirty and cleaning has started" in one call — no separate "mark
        dirty" endpoint exists. Exactly one of `equipment_id`/`area_id` must be set. Mirrors
        `CLEANING` onto the referenced asset's/area's `cleanliness_status` (CLN-FR-027). Rejected if a
        cleaning execution is already CLEANING/CLEANING_VERIFICATION for the same equipment/area
        (CLN-FR-006) — HOLD does not block a fresh attempt. Optional `sterilization_cycle_id` must
        reference an existing Document 42 CIP/SIP process_cycle (CLN-FR-025).
      x-requirement-ids: [CLN-FR-003, CLN-FR-004, CLN-FR-005, CLN-FR-006, CLN-FR-007, CLN-FR-025, CLN-FR-027, MUT-FR-005, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCleaningExecutionCommand' }
      responses:
        '200':
          description: Created at state CLEANING.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404':
          description: The referenced procedure_version_id, or sterilization_cycle_id if supplied, does not exist.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }
        '422':
          description: "VALIDATION_FAILED — exactly one of equipment_id/area_id must be set, or a cleaning execution is already active for this equipment/area (CLN-FR-006)."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }

  /cleaning/v1/executions/{execution_id}:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCleaningExecution
      tags: [cleaning]
      summary: Cleaning execution detail
      description: Not in the spec's declared API table; contracted because the router implements it.
      x-requirement-ids: [CLN-FR-003]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningExecution' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

  /cleaning/v1/executions/{execution_id}/steps:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postRecordCleaningStep
      tags: [cleaning]
      summary: Append a cleaning step to the in-progress execution (CLN-FR-007/008)
      description: Append-only progress capture into `steps_log`. Only valid while the execution is in state CLEANING.
      x-requirement-ids: [CLN-FR-007, CLN-FR-008, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordCleaningStepCommand' }
      responses:
        '200':
          description: Recorded.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409':
          description: "STALE_VERSION, or INVALID_TRANSITION — steps can only be recorded while state is CLEANING."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }
        '422':
          description: "VALIDATION_FAILED — execution_id in path and body must match."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }

  /cleaning/v1/executions/{execution_id}/signature-challenges:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postCleaningSignatureChallenge
      tags: [cleaning]
      summary: Create the signature challenge for postCompleteCleaning or postVerifyCleaning
      description: Not in the spec's declared API table; contracted because the router implements it. `action` selects the meaning — `complete` ("Performed") or `verify` ("Verified").
      x-requirement-ids: [SIG-FR-005]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleaningSignatureChallengeRequest' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SignatureChallengeResponse' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '422':
          description: "VALIDATION_FAILED — action is not complete/verify."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }

  /cleaning/v1/executions/{execution_id}/complete:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postCompleteCleaning
      tags: [cleaning]
      summary: Complete cleaning and move to pending verification (Document 106 row 109)
      description: >
        Only valid from state CLEANING; moves to CLEANING_VERIFICATION and mirrors that status onto the
        equipment/area. `reason` becomes required (application-level, not schema-level) when the
        execution is flagged `critical`. Signature is conditional on the current Document 106 policy row
        for `cleaning_execution`/`complete`.
      x-requirement-ids: [CLN-FR-009, CLN-FR-010, CLN-FR-027, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-011, MUT-FR-012, MUT-FR-015, MUT-FR-018, SIG-FR-004]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteCleaningCommand' }
      responses:
        '200':
          description: Moved to CLEANING_VERIFICATION.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409':
          description: "STALE_VERSION, or INVALID_TRANSITION — only an in-progress cleaning (state CLEANING) can be completed."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }
        '422':
          description: "VALIDATION_FAILED — execution_id mismatch, or reason missing while critical."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }
        '428':
          description: MISSING_SIGNATURE — policy requires a signature but no valid challenge/reauth was supplied, or fresh step-up authentication failed.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }

  /cleaning/v1/executions/{execution_id}/verify:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postVerifyCleaning
      tags: [cleaning]
      summary: Independently verify a completed cleaning (Document 106 row 110)
      description: >
        Only valid from state CLEANING_VERIFICATION. The verifier must be independent of the performer
        (SIG-FR-018) — rejected otherwise. `result: fail` moves to HOLD and sets `requires_deviation`
        (a valid, signed, retained outcome — never silently overwritten by a later repeat). `result: pass`
        moves to CLEAN and computes `clean_until` from the procedure's `clean_hold_limit_minutes`;
        exceeding `dirty_hold_limit_minutes` also sets `requires_deviation` even on a pass.
      x-requirement-ids: [CLN-FR-011, CLN-FR-012, CLN-FR-013, CLN-FR-014, CLN-FR-015, CLN-FR-027, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-012, MUT-FR-015, MUT-FR-018, SIG-FR-004, SIG-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCleaningCommand' }
      responses:
        '200':
          description: Verified — CLEAN or HOLD.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409':
          description: "STALE_VERSION, or INVALID_TRANSITION — only a cleaning pending verification (state CLEANING_VERIFICATION) can be verified."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }
        '422':
          description: "VALIDATION_FAILED — execution_id mismatch, result not pass/fail, or verifier is the same user as the performer (SIG-FR-018)."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }
        '428':
          description: MISSING_SIGNATURE.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }

  /cleaning/v1/equipment/{equipment_id}/status:
    parameters:
      - { name: equipment_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getEquipmentCleaningStatus
      tags: [cleaning]
      summary: Effective cleanliness status for an equipment asset (CLN-FR-027)
      description: >
        Clean-hold expiry is computed on read, not persisted speculatively (no background scheduler
        exists in this codebase, SPEC_GAP) — a CLEAN status past `clean_until` is reported as
        CLEAN_EXPIRED even though the underlying `equipment_assets.cleanliness_status` row still says
        CLEAN.
      x-requirement-ids: [CLN-FR-027]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentCleaningStatus' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

  /line-clearance/v1:
    post:
      operationId: postCreateLineClearance
      tags: [cleaning]
      summary: Start a line clearance (CLN-FR-016/017)
      description: No changeover-material/label reconciliation integration this pass — items is captured JSONB only (SPEC_GAP, same class as every "no consuming integration yet" gap).
      x-requirement-ids: [CLN-FR-016, CLN-FR-017, MUT-FR-005, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLineClearanceCommand' }
      responses:
        '200':
          description: Created at state IN_PROGRESS.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }

  /line-clearance/v1/{clearance_id}:
    parameters:
      - { name: clearance_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLineClearance
      tags: [cleaning]
      summary: Line clearance detail
      description: Not in the spec's declared API table; contracted because the router implements it.
      x-requirement-ids: [CLN-FR-016]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/LineClearance' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

  /line-clearance/v1/{clearance_id}/signature-challenges:
    parameters:
      - { name: clearance_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postLineClearanceSignatureChallenge
      tags: [cleaning]
      summary: Create the signature challenge for postCompleteLineClearance
      description: Not in the spec's declared API table; contracted because the router implements it. `action` must be `"complete"` (meaning `"Performed"`).
      x-requirement-ids: [SIG-FR-005]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineClearanceSignatureChallengeRequest' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SignatureChallengeResponse' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '422':
          description: "VALIDATION_FAILED — action is not \"complete\"."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }

  /line-clearance/v1/{clearance_id}/complete:
    parameters:
      - { name: clearance_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postCompleteLineClearance
      tags: [cleaning]
      summary: Complete a line clearance (CLN-FR-018/019/020/021/022/023, Document 106 row 111)
      description: >
        Only valid from state IN_PROGRESS or VERIFICATION_PENDING. `passed: true` moves to CLEARED with
        the supplied `expiry_at`, but only after every `item_type: "equipment"` entry in `items` passes
        Document 38 qualification/calibration/maintenance/hold eligibility and this module's own
        cleanliness_status check (CLN-FR-019) — otherwise `WRONG_EQUIPMENT_INSTALLED` and the clearance
        stays IN_PROGRESS. `passed: false` returns to NOT_STARTED (must be restarted, not retried in
        place). `reason` becomes required (application-level) when `critical=true`. Signature is
        conditional on the current Document 106 policy row for `line_clearance`/`complete`.
      x-requirement-ids: [CLN-FR-018, CLN-FR-019, CLN-FR-020, CLN-FR-021, CLN-FR-022, CLN-FR-023, MUT-FR-005, MUT-FR-009, MUT-FR-010, MUT-FR-011, MUT-FR-012, MUT-FR-015, MUT-FR-018, SIG-FR-004]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteLineClearanceCommand' }
      responses:
        '200':
          description: CLEARED or NOT_STARTED.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409':
          description: "STALE_VERSION, or INVALID_TRANSITION — only IN_PROGRESS/VERIFICATION_PENDING can be completed."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }
        '422':
          description: "VALIDATION_FAILED — clearance_id mismatch, or reason missing while critical. WRONG_EQUIPMENT_INSTALLED — an item_type=\"equipment\" checklist item is not currently eligible or not clean (CLN-FR-019)."
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }
        '428':
          description: MISSING_SIGNATURE.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    CleaningExecutionState:
      type: string
      description: "`CLEANLINESS_STATES` conflated with execution-specific states in `app/modules/equipment/cleaning_models.py` — the execution's own `state` column uses CLEANING/CLEANING_VERIFICATION/CLEAN/HOLD."
      x-requirement-ids: [CLN-FR-027, CTR-FR-017]
      enum: [CLEANING, CLEANING_VERIFICATION, CLEAN, HOLD]

    LineClearanceState:
      type: string
      description: "`LINE_CLEARANCE_STATES` in `app/modules/equipment/cleaning_models.py`."
      x-requirement-ids: [CLN-FR-016, CTR-FR-017]
      enum: [NOT_STARTED, IN_PROGRESS, VERIFICATION_PENDING, CLEARED, EXPIRED, USED]

    CleaningExecution:
      type: object
      description: "`_execution_dict` in `app/modules/equipment/cleaning_router.py`."
      x-requirement-ids: [CLN-FR-003, CLN-FR-004, CLN-FR-005, CLN-FR-006, CLN-FR-010, CLN-FR-014, CLN-FR-025]
      required: [id, site_id, procedure_version_id, state, dirty_since, version]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        equipment_id: { type: [string, "null"], format: uuid }
        area_id: { type: [string, "null"], format: uuid }
        procedure_version_id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/CleaningExecutionState' }
        dirty_since: { type: string, format: date-time }
        clean_until: { type: [string, "null"], format: date-time }
        verification_result: { type: [string, "null"], enum: [pass, fail, null] }
        dirty_hold_exceeded: { type: boolean }
        requires_deviation: { type: boolean }
        swab_sample_id: { type: [string, "null"], format: uuid, description: "CLN-FR-010 — set once the released procedure's sample_inspection_requirements trigger QC sample creation." }
        protection_state: { type: [object, "null"], description: "CLN-FR-014 — captured, not enforced." }
        sterilization_cycle_id: { type: [string, "null"], format: uuid, description: "CLN-FR-025 — link to a Document 42 CIP/SIP process_cycle." }
        version: { type: integer, minimum: 1 }

    LineClearance:
      type: object
      description: "`_clearance_dict` in `app/modules/equipment/cleaning_router.py`."
      x-requirement-ids: [CLN-FR-016, CLN-FR-017, CLN-FR-019]
      required: [id, site_id, state, version]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        area_id: { type: [string, "null"], format: uuid }
        previous_batch_id: { type: [string, "null"], format: uuid }
        next_batch_id: { type: [string, "null"], format: uuid }
        items: { type: [object, array, "null"] }
        state: { $ref: '#/components/schemas/LineClearanceState' }
        expiry_at: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }

    EquipmentCleaningStatus:
      type: object
      description: "`get_equipment_cleaning_status` in `app/modules/equipment/cleaning_commands.py`."
      x-requirement-ids: [CLN-FR-027]
      required: [equipment_id, cleanliness_status]
      properties:
        equipment_id: { type: string, format: uuid }
        cleanliness_status: { type: [string, "null"] }
        latest_execution_id: { type: [string, "null"], format: uuid }
        latest_execution_state: { type: [string, "null"] }
        clean_until: { type: [string, "null"], format: date-time }

    SignatureChallengeResponse:
      type: object
      description: postCleaningSignatureChallenge's / postLineClearanceSignatureChallenge's response.
      x-requirement-ids: [SIG-FR-005]
      required: [challenge_id, meaning, expires_at]
      properties:
        challenge_id: { type: string, format: uuid }
        meaning: { type: string }
        expires_at: { type: string, format: date-time }

    CleaningSignatureChallengeRequest:
      type: object
      additionalProperties: false
      description: Closed request payload. Not a CommandEnvelope — no idempotency_key.
      x-requirement-ids: [SIG-FR-005]
      required: [action]
      properties:
        action: { type: string, enum: [complete, verify] }

    LineClearanceSignatureChallengeRequest:
      type: object
      additionalProperties: false
      description: Closed request payload. Not a CommandEnvelope — no idempotency_key.
      x-requirement-ids: [SIG-FR-005]
      required: [action]
      properties:
        action: { type: string, enum: [complete] }

    CreateCleaningExecutionCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6). Exactly one of equipment_id/area_id must be supplied. A second concurrent execution against the same equipment_id/area_id while one is already CLEANING/CLEANING_VERIFICATION is rejected (CLN-FR-006).
      x-requirement-ids: [CLN-FR-003, CLN-FR-004, CLN-FR-005, CLN-FR-006, CLN-FR-025, MUT-FR-005, MUT-FR-010]
      required: [idempotency_key, site_id, procedure_version_id]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        site_id: { type: string, format: uuid }
        equipment_id: { type: [string, "null"], format: uuid }
        area_id: { type: [string, "null"], format: uuid }
        procedure_version_id: { type: string, format: uuid }
        batch_context: { type: [object, "null"] }
        dirty_since: { type: [string, "null"], format: date-time, description: Defaults to now if omitted. }
        critical: { type: boolean, default: false }
        sterilization_cycle_id: { type: [string, "null"], format: uuid, description: "CLN-FR-025 — optional link to a Document 42 CIP/SIP process_cycle; must reference an existing cycle." }

    RecordCleaningStepCommand:
      type: object
      additionalProperties: false
      description: Closed command payload (MUT-FR-005 / Document 113 §3 F6).
