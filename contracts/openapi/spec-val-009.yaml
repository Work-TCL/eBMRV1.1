openapi: 3.1.0
info:
  title: SPEC-VAL-009 — Data Migration, Conversion, Cutover & Reconciliation Validation
  version: 0.1.0
  description: >
    Document 113 contract for WP-14 Document 87 (`services/gxp-api/app/modules/validation/
    commands_migration.py`, `router_wp14.py`). 3 owned entities: `migration_validation_plan`,
    `migration_run`, `migration_reconciliation`. Document 106 row 153: `migrations/{id}/approve`
    requires an `Approved` signature from an independent QA Releaser, reason mandatory. Reconciliation
    tolerances are customer-authored per-plan data (`reconciliation_rules`); the platform ships no
    default and `migrations/{id}/reconcile` fails closed when a rule for a compared data class is
    missing (SG-171). `profileMigrationSource()` (FN-0842) is folded into `migrations/plans`;
    `verifyLegacyRecordTrace()` (FN-0846) is the inspection-read GET `migrations/{id}/legacy-trace`.
tags:
  - name: validation

paths:
  /validation/v1/migrations/plans:
    post:
      operationId: postValidationV1MigrationsPlans
      tags: [validation]
      summary: Create a controlled migration validation plan; profile the frozen source (MIGV-FR-001..006/013..015/019/021)
      x-requirement-ids: [MIGV-FR-001, MIGV-FR-002, MIGV-FR-003, MIGV-FR-004, MIGV-FR-005, MIGV-FR-006, MIGV-FR-013, MIGV-FR-014, MIGV-FR-015, MIGV-FR-019, MIGV-FR-021, MUT-FR-005, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMigrationValidationPlanCommand' } } }
      responses:
        '200': { description: Created; MutationReceipt., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '422': { description: VALIDATION_FAILED (missing source hash / reconciliation rules / mappings)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /validation/v1/migrations/runs:
    post:
      operationId: postValidationV1MigrationsRuns
      tags: [validation]
      summary: Execute a migration dry run or cutover run (MIGV-FR-007..013/016..018)
      x-requirement-ids: [MIGV-FR-007, MIGV-FR-008, MIGV-FR-009, MIGV-FR-011, MIGV-FR-012, MIGV-FR-013, MIGV-FR-016, MIGV-FR-017, MIGV-FR-018, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExecuteMigrationRunCommand' } } }
      responses:
        '200': { description: Recorded; MutationReceipt., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: INVALID_TRANSITION., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: VALIDATION_FAILED (source_hash mismatch without is_delta)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /validation/v1/migrations/{run_id}/reconcile:
    post:
      operationId: postValidationV1MigrationsIdReconcile
      tags: [validation]
      summary: Reconcile a migration run against the plan's reconciliation rules (MIGV-FR-008..011/020)
      x-requirement-ids: [MIGV-FR-008, MIGV-FR-009, MIGV-FR-010, MIGV-FR-011, MIGV-FR-020, MUT-FR-009, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReconcileMigrationRunCommand' } } }
      responses:
        '200': { description: Reconciled; MutationReceipt., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: STALE_VERSION | INVALID_TRANSITION., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: VALIDATION_FAILED (no reconciliation rule for a compared class — SG-171; missing critical-field method)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /validation/v1/migrations/{run_id}/approve:
    post:
      operationId: postValidationV1MigrationsIdApprove
      tags: [validation]
      summary: Approve a migration cutover after a PASSing reconciliation (MIGV-FR-020) — Document 106 row 153 signature
      x-requirement-ids: [MIGV-FR-020, MIGV-FR-022, SIG-FR-004, SIG-FR-006, SIG-FR-018, MUT-FR-009, MUT-FR-012, MUT-FR-013, MUT-FR-015]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApproveMigrationCutoverCommand' } } }
      responses:
        '200': { description: Accepted; MutationReceipt., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: STALE_VERSION | INVALID_TRANSITION | SIGNATURE_CHALLENGE_INVALID., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: VALIDATION_FAILED (reconciliation not PASS / deviation undispositioned / missing reason)., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '428': { description: MISSING_SIGNATURE., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /validation/v1/migrations/{plan_id}/legacy-trace:
    get:
      operationId: getValidationV1MigrationsIdLegacyTrace
      tags: [validation]
      summary: Inspection read — trace a legacy identifier to its new-system id / archive reference (MIGV-FR-007/021)
      x-requirement-ids: [MIGV-FR-007, MIGV-FR-021]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: plan_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: legacy_id, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200': { description: Legacy trace result., content: { application/json: { schema: { $ref: '#/components/schemas/LegacyTraceResult' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { description: NOT_FOUND | LEGACY_TRACE_MISSING., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    CreateMigrationValidationPlanCommand:
      type: object
      additionalProperties: false
      x-requirement-ids: [MIGV-FR-001, MIGV-FR-002, MIGV-FR-004, MIGV-FR-005, MIGV-FR-009]
      required: [idempotency_key, plan_number, source_system, scope, cutoff_at, source_snapshot_ref, source_snapshot_hash, mapping_version, transform_version, acceptance_criteria, regulated_history_strategy, rollback_strategy, legacy_access_strategy]
      properties:
        idempotency_key: { type: string }
        plan_number: { type: string }
        source_system: { type: string }
        scope: { type: string }
        cutoff_at: { type: string, format: date-time }
        source_snapshot_ref: { type: string }
        source_snapshot_hash: { type: string }
        mapping_version: { type: string }
        transform_version: { type: string }
        acceptance_criteria: { type: string }
        regulated_history_strategy: { type: string }
        rollback_strategy: { type: string }
        legacy_access_strategy: { type: string }
        target_system: { type: string }
        source_timezone: { type: [string, "null"] }
        mappings: { type: array, items: { type: object } }
        reconciliation_rules: { type: array, items: { type: object } }
        source_profile: { type: [object, "null"] }
        retention_class: { type: [string, "null"] }
    ExecuteMigrationRunCommand:
      type: object
      additionalProperties: false
      x-requirement-ids: [MIGV-FR-007, MIGV-FR-012, MIGV-FR-016, MIGV-FR-017, MIGV-FR-018]
      required: [idempotency_key, plan_id, run_type, source_hash, scripts_config]
      properties:
        idempotency_key: { type: string }
        plan_id: { type: string, format: uuid }
        run_type: { type: string, enum: [DRY_RUN, CUTOVER] }
        source_hash: { type: string }
        scripts_config: { type: object }
        counts: { type: object }
        control_totals: { type: object }
        identity_map: { type: object }
        rejected_records: { type: array, items: { type: object } }
        attachments: { type: object }
        legacy_signatures: { type: object }
        legacy_audit: { type: object }
        target_refs: { type: object }
        errors: { type: array, items: { type: object } }
        is_delta: { type: boolean }
        sandbox: { type: boolean }
        status: { type: string, enum: [COMPLETED, FAILED, INTERRUPTED] }
        prior_run_id: { type: [string, "null"], format: uuid }
    ReconcileMigrationRunCommand:
      type: object
      additionalProperties: false
      x-requirement-ids: [MIGV-FR-008, MIGV-FR-009, MIGV-FR-010, MIGV-FR-011]
      required: [idempotency_key, run_id, expected_version, count_comparison]
      properties:
        idempotency_key: { type: string }
        run_id: { type: string, format: uuid }
        expected_version: { type: integer }
        count_comparison: { type: object }
        control_total_comparison: { type: object }
        critical_field_comparison: { type: object }
        attachment_comparison: { type: object }
        reference_integrity: { type: object }
        deviations: { type: array, items: { type: object } }
    ApproveMigrationCutoverCommand:
      type: object
      additionalProperties: false
      x-requirement-ids: [MIGV-FR-020, SIG-FR-004]
      required: [idempotency_key, run_id, expected_version, reason, challenge_id, reauth_password]
      properties:
        idempotency_key: { type: string }
        run_id: { type: string, format: uuid }
        expected_version: { type: integer }
        reason: { type: string }
        challenge_id: { type: string, format: uuid }
        reauth_password: { type: string }
    LegacyTraceResult:
      type: object
      additionalProperties: true
      x-requirement-ids: [MIGV-FR-007, MIGV-FR-021]
      required: [legacy_id, provenance]
      properties:
        legacy_id: { type: string }
        new_id: { type: [string, "null"] }
        migration_run_id: { type: string, format: uuid }
        run_type: { type: string }
        source_hash: { type: string }
        legacy_audit: { type: object }
        rejected: { type: boolean }
        reason: { type: [string, "null"] }
        disposition: { type: [string, "null"] }
        legacy_archive: { type: string }
        provenance: { type: string, enum: [IDENTITY_MAP, REJECTED_RECORD, LEGACY_ARCHIVE] }
