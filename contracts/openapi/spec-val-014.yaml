openapi: 3.1.0
info:
  title: SPEC-VAL-014 — Security Qualification, Vulnerability Verification & Penetration Testing
  version: 0.1.0
  description: >
    Document 113 contract for WP-12 Document 92 (`services/gxp-api/app/modules/validation/
    commands_security.py`). 2 owned entities: `security_qualification_suite`,
    `security_qualification_finding`. Document 106 row 158: `security/{id}/approve` requires an
    `Approved` signature from an independent QA Releaser, reason mandatory.
tags:
  - name: validation

paths:
  /validation/v1/security/suites:
    post:
      operationId: postValidationSecuritySuites
      tags: [validation]
      summary: Define a security qualification suite (SECQ-FR-001/017/023)
      x-requirement-ids: [SECQ-FR-001, SECQ-FR-017, SECQ-FR-023, MUT-FR-005, MUT-FR-010, MUT-FR-015, MUT-FR-018]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSecuritySuiteCommand' } } }
      responses:
        '200': { description: Created; MutationReceipt., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }

  /validation/v1/security/tests:
    post:
      operationId: postValidationSecurityTests
      tags: [validation]
      summary: Record a security control test result (SECQ-FR-002..016)
      x-requirement-ids: [SECQ-FR-002, SECQ-FR-008, SECQ-FR-010]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecordSecurityTestCommand' } } }
      responses:
        '200': { description: Recorded; MutationReceipt., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '422': { description: VALIDATION_FAILED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /validation/v1/security/findings:
    post:
      operationId: postValidationSecurityFindings
      tags: [validation]
      summary: Import a scan/pen-test finding (SECQ-FR-014/015/016/019)
      x-requirement-ids: [SECQ-FR-014, SECQ-FR-015, SECQ-FR-016, SECQ-FR-019]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ImportFindingCommand' } } }
      responses:
        '200': { description: Imported; MutationReceipt., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '422': { description: VALIDATION_FAILED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

  /validation/v1/security/{suite_id}/gate:
    get:
      operationId: getValidationSecurityGate
      tags: [validation]
      summary: Live release gate for a security qualification suite (SECQ-FR-020)
      x-requirement-ids: [SECQ-FR-020]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: suite_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Gate view., content: { application/json: { schema: { $ref: '#/components/schemas/SecurityGateView' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

  /validation/v1/security/{suite_id}/approve:
    post:
      operationId: postValidationSecurityApprove
      tags: [validation]
      summary: Approve a security qualification (SECQ-FR-020/024)
      x-requirement-ids: [SECQ-FR-020, SECQ-FR-024, SIG-FR-004, MUT-FR-012, MUT-FR-013]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: suite_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApproveSecuritySuiteCommand' } } }
      responses:
        '200': { description: Approved; MutationReceipt., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/MutationReceipt' } } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }
        '409': { description: STALE_VERSION / SECURITY_RELEASE_BLOCKED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '422': { description: VALIDATION_FAILED., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }
        '428': { description: MISSING_SIGNATURE., content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    CreateSecuritySuiteCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, release_ref, deployment_profile, threat_control_baseline_ref]
      x-requirement-ids: [SECQ-FR-001, SECQ-FR-017]
      properties:
        idempotency_key: { type: string }
        release_ref: { type: string }
        deployment_profile: { type: string }
        threat_control_baseline_ref: { type: string }
        planned_tests: { type: array, items: { type: string } }

    RecordSecurityTestCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, suite_id, control_ref, result]
      x-requirement-ids: [SECQ-FR-002, SECQ-FR-010]
      properties:
        idempotency_key: { type: string }
        suite_id: { type: string, format: uuid }
        control_ref: { type: string }
        result: { type: string, enum: [PASS, FAIL] }
        severity_if_failed: { type: string, default: MEDIUM, enum: [LOW, MEDIUM, HIGH, CRITICAL] }

    ImportFindingCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, suite_id, source, control_ref, severity]
      x-requirement-ids: [SECQ-FR-014, SECQ-FR-015, SECQ-FR-016]
      properties:
        idempotency_key: { type: string }
        suite_id: { type: string, format: uuid }
        source: { type: string, enum: [SAST, SCA, IAC, CONTAINER, PENTEST, MANUAL] }
        control_ref: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        vulnerability_ref: { type: [string, 'null'] }

    SecurityGateView:
      type: object
      additionalProperties: false
      required: [blockers, gate_state, finding_count]
      x-requirement-ids: [SECQ-FR-020]
      properties:
        blockers: { type: array, items: { type: string } }
        gate_state: { type: string, enum: [PASSED, BLOCKED] }
        finding_count: { type: integer }

    ApproveSecuritySuiteCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, suite_id, expected_version, reason, challenge_id, reauth_password]
      x-requirement-ids: [SECQ-FR-020, SECQ-FR-024]
      properties:
        idempotency_key: { type: string }
        suite_id: { type: string, format: uuid }
        expected_version: { type: integer }
        reason: { type: string }
        challenge_id: { type: string, format: uuid }
        reauth_password: { type: string }
