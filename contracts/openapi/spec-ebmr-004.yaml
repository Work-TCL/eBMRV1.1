openapi: 3.1.0
info:
  title: SPEC-EBMR-004 — Genealogy & Traceability Engine
  version: 0.1.0
  description: >
    Document 113 contract for the Document 13 slice actually built
    (`services/gxp-api/app/modules/genealogy/`): the 5 read-only traversal/query APIs — node lookup,
    backward trace (ancestors), forward trace (descendants), a serial's full trace, and the
    "affected final products" recall-query slice from a material/supplier lot.


    NO PUBLIC WRITE API BY DESIGN, NOT BY GAP: per Document 13 §8 ("Write Path"), genealogy rows are
    meant to be generated by domain events from other modules (`MaterialConsumed`, `DrugBatchProduced`,
    `DeviceComponentAssembled`, `FillLinkedToDevice`, `PackagingCompleted`, `DistributionLinked`) — there
    is no `POST /genealogy/v1/nodes` or `/edges` in Document 13's own 8-API list, and this contract
    matches that boundary exactly. `create_node`/`create_edge`/`correct_edge` in
    `app/modules/genealogy/service.py` are internal functions other modules' commands call directly
    (e.g. `material`, this session's own module-4-of-8 SG-146 pass) — none of Document 13's own named
    domain-event consumers exist yet (SG-052), so today the graph is populated only by whichever other
    module's command happens to call these functions inline, not by an event bus subscription. This
    contract covers only the 5 read endpoints; the internal write functions are not part of any public
    API surface and are intentionally not contracted here.


    2 OF 2 OWNED ENTITIES ARE DDL-READY (the best ratio of any module built so far) — `genealogy_node`
    and `genealogy_edge` are both real tables, unlike most other WP-02/WP-03 modules. What's still
    missing is API surface, not schema: `POST /genealogy/v1/impact-assessments` and
    `POST /genealogy/v1/exports` (GEN-FR-018/019/020/030) have no backing entity anywhere in the data
    model catalogue and are deferred (SG-051) — not covered by this contract.


    SG-146 (UOM expand step, resolved 2026-08-27): `GenealogyEdge.uom` is validated against the
    Document 110 §3 controlled UOM master best-effort by `create_edge` — an unresolved code does not fail
    the write; see `uom_id` on `GenealogyNode`'s sibling edge-shaped responses. No endpoint in this
    contract returns a `GenealogyEdge` row directly today — traversal responses return only the `nodes`
    each trace reaches plus a bare `edge_ids` list, not the edges' own field data (including `uom`/
    `uom_id`) — see `TraversalResult` below.
tags:
  - name: genealogy

paths:
  /genealogy/v1/nodes/lookup:
    get:
      operationId: getGenealogyNodesLookup
      tags: [genealogy]
      summary: Find genealogy nodes by site, type and/or business reference (GEN-FR-001)
      description: >
        Requires the `genealogy.view` policy action. `site_id` is required; `node_type` and
        `business_ref` are optional exact-match filters, applied together (AND) when both are supplied.
        Ordered newest-first. Returns a plain array — not paginated (CTR-FR-012 deviation, the same
        pattern as this codebase's other bounded list endpoints); unbounded in principle for a
        high-volume site, a known limitation shared with GEN-FR-029 (performance) not addressed this
        pass.
      x-requirement-ids: [GEN-FR-001]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: site_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: node_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/GenealogyNodeType' }
        - name: business_ref
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GenealogyNode' } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }

  /genealogy/v1/nodes/{node_id}/ancestors:
    parameters:
      - name: node_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGenealogyNodeAncestors
      tags: [genealogy]
      summary: Backward trace from a node (GEN-FR-004)
      description: >
        Requires `genealogy.view`. Breadth-first walk over `ANCESTRY_EDGE_TYPES` (every controlled edge
        type except `REWORKED_FROM`/`SUPERSEDED` — GEN-FR-014/024, those legitimately point backward
        without implying ancestry) moving from a node's `to_node_id` side toward `from_node_id`, bounded
        at `MAX_TRAVERSAL_DEPTH = 50` hops (GEN-FR-025). `truncated: true` means the walk hit the depth
        bound with more frontier still unexplored — the result is a partial trace, not the complete
        ancestry, and callers must not treat it as exhaustive.
      x-requirement-ids: [GEN-FR-004, GEN-FR-024, GEN-FR-025]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TraversalResult' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

  /genealogy/v1/nodes/{node_id}/descendants:
    parameters:
      - name: node_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGenealogyNodeDescendants
      tags: [genealogy]
      summary: Forward trace from a node (GEN-FR-003)
      description: >
        Requires `genealogy.view`. Mirror of `getGenealogyNodeAncestors`, walking `ANCESTRY_EDGE_TYPES`
        forward from `from_node_id` toward `to_node_id`, same depth bound and truncation semantics
        (GEN-FR-025).
      x-requirement-ids: [GEN-FR-003, GEN-FR-024, GEN-FR-025]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TraversalResult' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'spec-gxp-001.yaml#/components/responses/NotFound' }

  /genealogy/v1/serial/{serial}/full-trace:
    parameters:
      - name: serial
        in: path
        required: true
        schema: { type: string, maxLength: 200 }
      - name: site_id
        in: query
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGenealogySerialFullTrace
      tags: [genealogy]
      summary: Both directions of a serial's genealogy in one call (GEN-FR-004/010)
      description: >
        Requires `genealogy.view`. Resolves `serial` against `(site_id, business_ref)` to find the root
        node — `NOT_FOUND` if no node carries that `business_ref` at that site — then returns its
        ancestors and descendants together (GEN-FR-010: a serial's own full relationship, not just one
        direction).
      x-requirement-ids: [GEN-FR-004, GEN-FR-010]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/FullTraceResult' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — no genealogy node has this `business_ref` at this `site_id`.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }

  /genealogy/v1/material-lot/{lot}/affected-products:
    parameters:
      - name: lot
        in: path
        required: true
        schema: { type: string, maxLength: 200 }
      - name: site_id
        in: query
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGenealogyMaterialLotAffectedProducts
      tags: [genealogy]
      summary: Final products downstream of a material/supplier lot — the recall-query slice (GEN-FR-003/018/020)
      description: >
        Requires `genealogy.view`. Resolves `lot` against `(site_id, business_ref)` — `NOT_FOUND`
        otherwise — then forward-traces and filters to `FINAL_PRODUCT_NODE_TYPES` only (`device_unit`,
        `combination_product_lot`, `combination_product_serial`, `package`, `carton`, `pallet`,
        `distribution_reference`). This is the "affected final products" slice of GEN-FR-018's full
        recall query only — quality-event cross-reference (GEN-FR-019 complaint query, GEN-FR-020
        supplier-impact beyond this forward trace) is not built, because no quality module exists yet
        (SG-052).
      x-requirement-ids: [GEN-FR-003, GEN-FR-018, GEN-FR-020]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AffectedProductsResult' } } }
        '401': { $ref: 'spec-gxp-001.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'spec-gxp-001.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — no genealogy node has this `business_ref` at this `site_id`.
          content: { application/json: { schema: { $ref: 'spec-gxp-001.yaml#/components/schemas/ErrorResponse' } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    GenealogyNodeType:
      type: string
      description: "`NODE_TYPES` in `app/modules/genealogy/models.py` (GEN-FR-001) — the node types named across Document 13 §2's graph model and §3's requirement text."
      x-requirement-ids: [GEN-FR-001]
      enum: [supplier_lot, material_lot, material_container, drug_batch, intermediate, fill_group, device_component_lot, device_component_serial, device_unit, combination_product_lot, combination_product_serial, package, carton, pallet, distribution_reference, evidence_record, constituent_compatibility_version]

    GenealogyEdgeType:
      type: string
      description: "`EDGE_TYPES` in `app/modules/genealogy/models.py` (GEN-FR-002) — Document 13 §5's authoritative controlled edge-type catalogue (not the illustrative synonyms, e.g. CONTAINS/TESTED_BY, that appear only in requirement prose)."
      x-requirement-ids: [GEN-FR-002]
      enum: [RECEIVED_AS, SPLIT_FROM, DERIVED_FROM, CONSUMED_IN, PRODUCED_AS, FILLED_INTO, ASSEMBLED_INTO, PACKAGED_AS, AGGREGATED_INTO, STERILIZED_IN, REWORKED_FROM, SUPERSEDES, DISTRIBUTED_AS]

    GenealogyNode:
      type: object
      description: "One genealogy node (`app/modules/genealogy/router.py:_node_dict`). Nodes are pure insert-only facts (GEN-FR-016) — no `version`/`state` column exists on this entity; only edges are ever superseded (GEN-FR-017)."
      x-requirement-ids: [GEN-FR-001, GEN-FR-008, GEN-FR-016]
      required: [node_id, site_id, node_type]
      properties:
        node_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        node_type: { $ref: '#/components/schemas/GenealogyNodeType' }
        business_ref: { type: [string, "null"], maxLength: 200, description: The external/human-readable identifier this node is looked up by (serial number, lot number, etc). }
        authoritative_record_type: { type: [string, "null"], maxLength: 80, description: "Which owning module's record this node represents, e.g. \"material_lot\", \"batch\"." }
        authoritative_record_id: { type: [string, "null"], format: uuid }
        authoritative_version: { type: [integer, "null"], description: GEN-FR-008 — the authoritative record's own version at the time this node was linked. }
        record_hash: { type: [string, "null"], description: GEN-FR-008 — provenance digest, when the source record carries one. }

    TraversalResult:
      type: object
      description: >
        getGenealogyNodeAncestors/getGenealogyNodeDescendants's response
        (`app/modules/genealogy/router.py:_trace_dict`). Returns the nodes reached and the bare ids of
        the edges walked — not the edges' own field data (`quantity`/`uom`/`uom_id`/`step_id`/etc are not
        returned by any endpoint in this contract; a caller needing edge detail must resolve `edge_ids`
        by a mechanism outside this API today, SG-013).
      x-requirement-ids: [GEN-FR-003, GEN-FR-004, GEN-FR-025]
      required: [root_node_id, nodes, edge_ids, truncated]
      properties:
        root_node_id: { type: string, format: uuid }
        nodes: { type: array, items: { $ref: '#/components/schemas/GenealogyNode' } }
        edge_ids: { type: array, items: { type: string, format: uuid } }
        truncated: { type: boolean, description: "True when the walk hit MAX_TRAVERSAL_DEPTH (50) with unexplored frontier remaining (GEN-FR-025) — the result is then a partial, not complete, trace." }

    FullTraceResult:
      type: object
      description: getGenealogySerialFullTrace's response.
      x-requirement-ids: [GEN-FR-004, GEN-FR-010]
      required: [root, ancestors, descendants]
      properties:
        root: { $ref: '#/components/schemas/GenealogyNode' }
        ancestors: { $ref: '#/components/schemas/TraversalResult' }
        descendants: { $ref: '#/components/schemas/TraversalResult' }

    AffectedProductsResult:
      type: object
      description: getGenealogyMaterialLotAffectedProducts's response.
      x-requirement-ids: [GEN-FR-003, GEN-FR-018, GEN-FR-020]
      required: [root, affected_products, truncated]
      properties:
        root: { $ref: '#/components/schemas/GenealogyNode' }
        affected_products: { type: array, items: { $ref: '#/components/schemas/GenealogyNode' }, description: "The subset of the forward trace's nodes whose node_type is in FINAL_PRODUCT_NODE_TYPES." }
        truncated: { type: boolean, description: Inherited from the underlying forward trace's own truncation flag (GEN-FR-025) — a recall query against a truncated trace is not a complete answer. }
