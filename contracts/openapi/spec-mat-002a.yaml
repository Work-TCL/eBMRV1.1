      x-requirement-ids: [RCV-FR-020, RCV-FR-022, MUT-FR-005, MUT-FR-009, MUT-FR-010]
      required: [idempotency_key, sampling_order_id, expected_version, sample_quantity, sample_uom]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        sampling_order_id: { type: string, format: uuid, description: Must equal the path parameter. }
        expected_version: { type: integer, minimum: 1 }
        sample_quantity: { type: string, description: Decimal string. }
