        labeling_ok: { type: boolean }
        damage_observed: { type: boolean }
        seal_broken: { type: boolean }
        contamination_observed: { type: boolean }
        examination_notes: { type: [string, "null"], maxLength: 2000 }
        identity_confirmed: { type: boolean }
        internal_lot: { type: string, maxLength: 100, description: The internal lot number to assign if the examination is clean. }
        container_count: { type: integer, minimum: 1, default: 1 }
        discrepancy_reason: { type: [string, "null"], description: Required when identity_confirmed is false. }

    CreateSamplingOrderCommand:
