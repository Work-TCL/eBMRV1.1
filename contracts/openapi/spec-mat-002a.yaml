      required: [idempotency_key, lot_id, expected_version, challenge_id, reauth_password]
      properties:
        idempotency_key: { type: string, maxLength: 200 }
        lot_id: { type: string, format: uuid, description: Must equal the path parameter. }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: [string, "null"] }
        container_ids: { type: [array, "null"], items: { type: string, format: uuid }, description: "Omit for a whole-lot decision; supply to disposition only these containers (RCV-FR-030)." }
        challenge_id: { type: string, format: uuid }
        reauth_password: { type: string, format: password, writeOnly: true }

    RejectMaterialLotCommand:
      type: object
      additionalProperties: false
