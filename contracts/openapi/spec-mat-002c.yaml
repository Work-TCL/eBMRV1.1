        container_id: { type: [string, "null"], format: uuid }
        reservation_id: { type: [string, "null"], format: uuid }
        scanned_container_code: { type: [string, "null"], description: Verified by server lookup against the resolved container, never trusted as given. }
        quantity: { type: string, description: "Decimal string. Must be positive." }
        challenge_id: { type: string, format: uuid }
        reauth_password: { type: string, format: password, writeOnly: true }

